[theme]
name = "tokyo-night-day"
auto_switch = false

[ui.sound]
enabled = false

[ui.toast]
delivery = "terminal"

[ui.toast.clipboard]
position = "top-right"

[ui]
show_agent_labels_on_pane_borders = true
mouse_capture = true
agent_panel_sort = "priority"
# agent 状態インジケータを色だけでなく形でも区別する（既定は色付きドットのみ）
status_indicators = "symbols"
# タブバー右端に zoom 中であることを示す ZOOM ピルを表示する（alt+z 多用のため）
tab_bar_right = [{ type = "zoom" }]

# tmux の prefix なし Alt ショートカット相当を追加する
# （prefix ベースのデフォルトバインドはそのまま残す）
[keys]
next_tab = ["prefix+n", "alt+shift+n"]
previous_tab = ["prefix+p", "alt+shift+p"]
new_tab = ["prefix+c", "alt+t"]
new_workspace = ["alt+c"]
open_worktree = ["alt+o"]
copy_mode = ["prefix+[", "alt+[", "alt+]"]
swap_pane_left = "alt+left"
swap_pane_down = "alt+down"
swap_pane_up = "alt+up"
swap_pane_right = "alt+right"
rename_tab = ["prefix+shift+t", "alt+shift+t"]
rename_workspace = ["alt+comma"]
switch_tab = ["prefix+1..9", "alt+1..9"]
goto = ["prefix+g", "alt+w"]
previous_workspace = "alt+p"
next_workspace = "alt+n"
focus_pane_left = ["prefix+h", "alt+h"]
focus_pane_down = ["prefix+j", "alt+j"]
focus_pane_up = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]
zoom = ["prefix+z", "alt+z"]
split_vertical = ["prefix+v", "alt+\\"]
split_horizontal = ["prefix+minus", "alt+minus"]
reload_config = ["prefix+shift+r", "alt+r"]
toggle_sidebar = ["prefix+b", "alt+e"]

[[keys.command]]
key = "alt+shift+j"
type = "shell"
command = "HERDR_ENV=1 ~/.local/bin/herdr-fork.sh down"

[[keys.command]]
key = "alt+shift+k"
type = "shell"
command = "HERDR_ENV=1 ~/.local/bin/herdr-fork.sh up"

[[keys.command]]
key = "alt+shift+l"
type = "shell"
command = "HERDR_ENV=1 ~/.local/bin/herdr-fork.sh right"

# Alt+F: フォーカス中のペインで claude-skills プラグインの popup を開く。
# 選択したスキルは picker.sh が `/name ` として `herdr pane send-text` で挿入する。
# Claude Code のプロンプト入力中でも、herdr が自身のキーバインドとして先取り
# するためペインに Alt+F は渡らない。
[[keys.command]]
key = "alt+f"
type = "shell"
command = "~/.local/bin/herdr-open-claude-skills.sh"

# Alt+Shift+H: フォーカス中のペインで claude-history プラグインの popup を開く。
# 選択したプロンプト本文を picker.sh が `herdr pane send-text` で挿入する。
# alt+h は focus_pane_left として温存するため alt+shift+h を割り当てている。
# 元々 alt+shift+h に紐付いていた pane fork left は廃止した。
[[keys.command]]
key = "alt+shift+h"
type = "shell"
command = "~/.local/bin/herdr-open-claude-history.sh"

[experimental]
switch_ascii_input_source_in_prefix = true
